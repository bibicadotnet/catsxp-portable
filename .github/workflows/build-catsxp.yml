name: Auto Build Catsxp

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Catsxp via Winget
        run: winget install -e --id Catsxp.Catsxp --architecture x64 --accept-package-agreements --accept-source-agreements
        
      - name: Prepare Portable Files
        id: prepare
        shell: pwsh
        run: |
          $appData = $env:LOCALAPPDATA
          $basePath = "$appData\CatsxpSoftware\Catsxp-Browser\Application"
          
          if (-not (Test-Path $basePath)) {
              exit 1
          }
          
          $versionDir = Get-ChildItem -Path $basePath -Directory | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Select-Object -First 1
          
          if (-not $versionDir) {
              exit 1
          }
          
          $version = $versionDir.Name
          
          echo "VERSION=$version" >> $env:GITHUB_ENV
          
          $staging = "$pwd\Catsxp_Portable"
          New-Item -ItemType Directory -Path $staging | Out-Null
          
          Copy-Item -Path "$basePath\catsxp.exe" -Destination $staging
          
          Copy-Item -Path $versionDir.FullName -Destination "$staging\$version" -Recurse
          
          $installerPath = "$staging\$version\Installer"
          if (Test-Path $installerPath) {
              Remove-Item -Path $installerPath -Recurse -Force
          }
          
          $zipFile = "Catsxp_Portable_v$($version)_x64.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipFile
          
          echo "ZIP_FILE=$zipFile" >> $env:GITHUB_ENV

      - name: Check if Release Exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ env.VERSION }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: ${{ env.ZIP_FILE }}
