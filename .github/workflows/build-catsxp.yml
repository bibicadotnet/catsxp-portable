name: Auto Build Catsxp Portable

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Latest Manifest from winget-pkgs
        id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. List version folders for the package
          $listUrl = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/c/Catsxp/Catsxp"
          $dirs = Invoke-RestMethod -Uri $listUrl -Headers @{ "User-Agent" = "gh-actions" }
          $latest = $dirs | Where-Object { $_.type -eq "dir" } | Sort-Object { [version]$_.name } -Descending | Select-Object -First 1

          if (-not $latest) {
              Write-Error "Could not find any version folder in winget-pkgs"
              exit 1
          }

          $version = $latest.name
          Write-Host "Latest manifest version: $version"

          # 2. Fetch the installer yaml for that version
          $installerYamlUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/c/Catsxp/Catsxp/$version/Catsxp.Catsxp.installer.yaml"
          $yamlContent = Invoke-RestMethod -Uri $installerYamlUrl -Headers @{ "User-Agent" = "gh-actions" }

          # 3. Extract the x64/user installer block (URL + sha256)
          #    Match the "- Architecture: x64" ... "Scope: user" block specifically
          $lines = $yamlContent -split "`n"
          $url = $null
          $sha256 = $null
          $inX64Machine = $false
          $currentArch = $null
          $currentScope = $null
          $pendingUrl = $null
          $pendingSha = $null

          foreach ($line in $lines) {
              if ($line -match '^\s*-\s*Architecture:\s*(\S+)') {
                  $currentArch = $matches[1]
                  $currentScope = $null
                  $pendingUrl = $null
                  $pendingSha = $null
              }
              elseif ($line -match '^\s*Scope:\s*(\S+)') {
                  $currentScope = $matches[1]
              }
              elseif ($line -match '^\s*InstallerUrl:\s*(\S+)') {
                  $pendingUrl = $matches[1]
              }
              elseif ($line -match '^\s*InstallerSha256:\s*(\S+)') {
                  $pendingSha = $matches[1]
                  if ($currentArch -eq "x64" -and $currentScope -eq "user") {
                      $url = $pendingUrl
                      $sha256 = $pendingSha
                  }
              }
          }

          if (-not $url -or -not $sha256) {
              Write-Error "Could not extract x64/user InstallerUrl or InstallerSha256 from manifest"
              exit 1
          }

          Write-Host "Installer URL: $url"
          Write-Host "Installer SHA256: $sha256"

          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "INSTALLER_URL=$url" >> $env:GITHUB_ENV
          echo "INSTALLER_SHA256=$sha256" >> $env:GITHUB_ENV

      - name: Download and Install Catsxp (x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = "$env:RUNNER_TEMP\catsxp_installer_x64.exe"
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installerPath

          $actualHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
          if ($actualHash -ne $env:INSTALLER_SHA256) {
              Write-Error "SHA256 mismatch! Expected $env:INSTALLER_SHA256 but got $actualHash"
              exit 1
          }
          Write-Host "SHA256 verified OK."

          # User scope install (no --system-level) so it lands in %LOCALAPPDATA%, matching the Prepare step below
          Start-Process -FilePath $installerPath -ArgumentList "--do-not-launch-chrome" -Wait

      - name: Prepare Portable Files
        id: prepare
        shell: pwsh
        run: |
          $appData = $env:LOCALAPPDATA
          $basePath = "$appData\CatsxpSoftware\Catsxp-Browser\Application"
          
          if (-not (Test-Path $basePath)) {
              exit 1
          }
          
          $versionDir = Get-ChildItem -Path $basePath -Directory | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Select-Object -First 1
          
          if (-not $versionDir) {
              exit 1
          }
          
          $version = $versionDir.Name
          
          echo "VERSION=$version" >> $env:GITHUB_ENV
          
          $staging = "$pwd\Catsxp_Portable"
          New-Item -ItemType Directory -Path $staging | Out-Null
          
          Copy-Item -Path "$basePath\catsxp.exe" -Destination $staging
          
          Copy-Item -Path $versionDir.FullName -Destination "$staging\$version" -Recurse
          
          $installerPath = "$staging\$version\Installer"
          if (Test-Path $installerPath) {
              Remove-Item -Path $installerPath -Recurse -Force
          }
          
          $zipFile = "v$($version)_x64.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipFile
          
          echo "ZIP_FILE=$zipFile" >> $env:GITHUB_ENV

      - name: Check if Release Exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ env.VERSION }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: ${{ env.ZIP_FILE }}
