name: Auto Build Catsxp Portable

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Latest Version and URL from Catsxp Update API
        id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $body = '<?xml version="1.0" encoding="UTF-8"?><request><app appid="{485AC8F6-31A4-3283-B765-92E31A816C51}" version="132.4.12.1" ap="x86-release" /><app appid="{485AC8F6-31A4-3283-B765-92E31A816C51}" version="132.4.12.1" ap="x64-release" /></request>'
          $resp = Invoke-RestMethod -Uri 'https://www.catsxp.com/api/service/Update?cup2key=:' -Method Post -Body $body -ContentType "application/xml"
          [xml]$xml = $resp
          # Second app element (index 1) corresponds to x64-release
          $x64App = $xml.response.app[1]
          if ($x64App.updatecheck.status -ne "ok") {
              Write-Error "Update check failed for x64"
              exit 1
          }
          $version = $x64App.updatecheck.manifest.version
          # Use the first codebase URL for x64 returned directly by the server
          $url = $x64App.updatecheck.urls.url[0].codebase
          # SHA256 hash returned directly by the server for the package
          $sha256 = $x64App.updatecheck.manifest.packages.package.hash_sha256
          if (-not $version -or -not $url -or -not $sha256) {
              Write-Error "Could not extract version, URL, or SHA256 from XML response"
              exit 1
          }
          Write-Host "Latest version: $version"
          Write-Host "Installer URL: $url"
          Write-Host "Installer SHA256: $sha256"
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "INSTALLER_URL=$url" >> $env:GITHUB_ENV
          echo "INSTALLER_SHA256=$sha256" >> $env:GITHUB_ENV

      - name: Check if Release Exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ env.VERSION }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ env.VERSION }} already exists, skipping build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${{ env.VERSION }} does not exist, proceeding with build."
          fi

      - name: Download and Install Catsxp (x64)
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = "$env:RUNNER_TEMP\catsxp_installer_x64.exe"
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installerPath

          if ($env:INSTALLER_SHA256) {
              $actualHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
              if ($actualHash.ToLower() -ne $env:INSTALLER_SHA256.ToLower()) {
                  Write-Error "SHA256 mismatch! Expected $env:INSTALLER_SHA256 but got $actualHash"
                  exit 1
              }
              Write-Host "SHA256 verified OK."
          } else {
              Write-Host "No hash provided by API, skipping verification."
          }

          # User scope install (no --system-level) so it lands in %LOCALAPPDATA%, matching the Prepare step below
          Start-Process -FilePath $installerPath -ArgumentList "--do-not-launch-chrome" -Wait

      - name: Prepare Portable Files
        id: prepare
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $appData = $env:LOCALAPPDATA
          $basePath = "$appData\CatsxpSoftware\Catsxp-Browser\Application"
          
          if (-not (Test-Path $basePath)) {
              exit 1
          }
          
          $versionDir = Get-ChildItem -Path $basePath -Directory | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Select-Object -First 1
          
          if (-not $versionDir) {
              exit 1
          }
          
          $version = $versionDir.Name
          
          $staging = "$pwd\Catsxp_Portable"
          New-Item -ItemType Directory -Path $staging | Out-Null
          
          Copy-Item -Path "$basePath\catsxp.exe" -Destination $staging
          
          Copy-Item -Path $versionDir.FullName -Destination "$staging\$version" -Recurse
          
          $installerPath = "$staging\$version\Installer"
          if (Test-Path $installerPath) {
              Remove-Item -Path $installerPath -Recurse -Force
          }
          
          $zipFile = "v$($version)_x64.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipFile
          
          echo "ZIP_FILE=$zipFile" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: ${{ env.ZIP_FILE }}
